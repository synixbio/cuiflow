name: CI

# GitHub Actions. Lint, strict typing and the unit tests on every push and pull request; on a v*
# tag, also build the sdist and wheel, check them, and publish those same files to PyPI through
# Trusted Publishing (OIDC: no API token is stored anywhere), with signed attestations. The
# publish job runs in the `pypi` environment; RELEASING.md covers setting it up. The engines'
# integration tests need a built UMLS index, which is licensed and never stored here, so they
# run nightly on a self-hosted Gitea runner that has one (.gitea/workflows/nightly.yml).
# .gitea/workflows/ci.yml mirrors this file for the Gitea remote, without the publish job; keep
# the two in step.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core, dev tools, and the light extras
        # umlsmatch's base install is stdlib-only; fastapi and mcp exercise the interfaces.
        run: python -m pip install -e ".[dev,server,mcp,parquet]"

      - name: Lint
        run: |
          ruff check src tests tools examples
          ruff format --check src tests tools examples

      - name: Type-check
        run: mypy

      - name: Unit tests
        run: pytest -q -m "not integration"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Tag must match the packaged version
        run: |
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/cuiflow/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "packaged version: $version   tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in src/cuiflow/__init__.py"
            exit 1
          fi

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import cuiflow; print(cuiflow.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Uploads exactly the files the build job checked and smoke-installed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cuiflow/
    permissions:
      id-token: write  # Trusted Publishing and attestations; nothing else in this job
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
